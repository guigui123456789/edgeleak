<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EdgeLeak — Onboarding</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231a3a26'/%3E%3Ctext x='50%25' y='66%25' text-anchor='middle' fill='%23d4af37' font-family='Georgia' font-style='italic' font-size='20'%3EE%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --felt-900:oklch(0.18 0.04 155);--felt-800:oklch(0.22 0.05 155);--felt-700:oklch(0.30 0.06 155);--felt-600:oklch(0.42 0.07 155);
  --cream-50:oklch(0.985 0.008 90);--cream-100:oklch(0.97 0.012 88);--cream-200:oklch(0.94 0.014 85);--cream-300:oklch(0.89 0.016 82);
  --ink-900:oklch(0.18 0.012 60);--ink-700:oklch(0.32 0.012 60);--ink-500:oklch(0.50 0.012 60);--ink-300:oklch(0.78 0.008 60);
  --carmine-600:oklch(0.55 0.18 25);--carmine-500:oklch(0.62 0.18 25);
  --gold-500:oklch(0.78 0.09 85);--gold-400:oklch(0.85 0.08 85);
  --serif:"Instrument Serif","Newsreader",Georgia,serif;
  --body:"Newsreader",Georgia,serif;
  --sans:"Geist",-apple-system,sans-serif;
  --mono:"Geist Mono",monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;-webkit-font-smoothing:antialiased}
body{font-family:var(--body);background:var(--felt-900);color:var(--cream-50)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}

.shell{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}

/* LEFT */
aside.left{background:radial-gradient(ellipse at 30% 30%,var(--felt-700) 0%,var(--felt-900) 70%);padding:48px 56px;display:flex;flex-direction:column;justify-content:space-between;color:var(--cream-50);position:relative;overflow:hidden}
aside.left::before{content:'';position:absolute;inset:0;background-image:url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='20' cy='20' r='1' fill='rgba(255,255,255,0.025)'/%3E%3C/svg%3E");background-size:40px 40px;pointer-events:none}
.brand{font-family:var(--serif);font-size:21px;font-style:italic;letter-spacing:-.02em;color:var(--cream-50);text-decoration:none;display:inline-flex;align-items:baseline;position:relative;z-index:1}
.brand .acc{color:var(--gold-500)}
.brand .dot{width:5px;height:5px;border-radius:50%;background:var(--carmine-500);margin-left:5px;align-self:center}
.left-content{position:relative;z-index:1}
.welcome-eyebrow{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.18em;color:var(--carmine-500);margin-bottom:20px;display:inline-flex;align-items:center;gap:8px}
.welcome-eyebrow::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--carmine-500)}
.welcome-title{font-family:var(--serif);font-size:clamp(36px,4vw,52px);font-weight:400;line-height:1.05;letter-spacing:-.025em;color:var(--cream-50);margin-bottom:24px}
.welcome-title em{font-style:italic;color:var(--gold-500)}
.welcome-sub{font-family:var(--body);font-size:15px;color:rgba(255,255,255,.7);line-height:1.65;max-width:420px;margin-bottom:48px}
.progress-bar{display:flex;gap:6px;margin-bottom:14px;max-width:420px}
.pseg{flex:1;height:2px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden;position:relative}
.pseg.active{background:var(--gold-500)}
.pseg.passed{background:var(--gold-500);opacity:.4}
.pstep{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.45)}
.aces{position:relative;z-index:1;display:flex;gap:0;align-items:flex-end}
.ace{width:64px;height:90px;background:var(--cream-50);border:1px solid var(--cream-300);border-radius:7px;display:flex;flex-direction:column;justify-content:space-between;padding:8px 10px;font-family:var(--serif);font-size:18px;font-style:italic;color:var(--ink-900);box-shadow:0 8px 24px rgba(0,0,0,.25);position:relative}
.ace.spades{color:var(--ink-900)}
.ace.hearts{color:var(--carmine-600);transform:rotate(-8deg) translateX(8px);margin-left:-12px}
.ace .top{align-self:flex-start;line-height:1}
.ace .bot{align-self:flex-end;transform:rotate(180deg);line-height:1}
.ace .mid{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:30px}
.ace.hearts .mid{transform:translate(-50%,-50%) rotate(8deg)}

/* RIGHT */
main.right{background:var(--cream-100);padding:48px 56px;display:flex;flex-direction:column;justify-content:space-between;color:var(--ink-900);overflow-y:auto}
.step-content{max-width:540px;animation:slideUp .4s cubic-bezier(.22,1,.36,1) both}
.step-eyebrow{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.18em;color:var(--carmine-600);margin-bottom:20px;margin-top:80px;display:inline-flex;align-items:center;gap:8px}
.step-eyebrow::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--carmine-600)}
.step-title{font-family:var(--serif);font-size:clamp(32px,3.5vw,46px);font-weight:400;line-height:1.05;letter-spacing:-.02em;color:var(--ink-900);margin-bottom:14px}
.step-title em{font-style:italic;color:var(--felt-700)}
.step-sub{font-family:var(--body);font-size:15px;color:var(--ink-500);line-height:1.6;margin-bottom:36px;max-width:480px}

/* Inputs */
.field{margin-bottom:18px}
.field-label{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-500);margin-bottom:8px;display:block;font-weight:500}
.input{width:100%;background:var(--cream-50);border:1px solid var(--cream-300);border-radius:10px;color:var(--ink-900);font-family:var(--body);font-size:15px;padding:14px 18px;outline:none;transition:border-color .15s}
.input:focus{border-color:var(--felt-600);box-shadow:0 0 0 3px rgba(48,90,60,.08)}
.checkbox-row{display:flex;align-items:flex-start;gap:10px;margin-top:18px;font-family:var(--body);font-size:13px;color:var(--ink-500);cursor:pointer}
.checkbox-row input{width:16px;height:16px;cursor:pointer;accent-color:var(--carmine-600);margin-top:2px;flex-shrink:0}

/* Multi-select boxes (game type) */
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt-box{background:var(--cream-50);border:1px solid var(--cream-300);border-radius:12px;padding:18px 20px;cursor:pointer;font-family:var(--body);font-size:14px;color:var(--ink-700);transition:all .15s;text-align:left}
.opt-box:hover{border-color:var(--ink-300)}
.opt-box.selected{border-color:var(--carmine-600);background:rgba(180,55,40,.04);box-shadow:0 0 0 3px rgba(180,55,40,.08)}

/* Pill grid (stakes) */
.pill-grid{display:flex;flex-wrap:wrap;gap:8px}
.pill{padding:10px 18px;border-radius:999px;border:1px solid var(--cream-300);background:var(--cream-50);font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:var(--ink-700);cursor:pointer;transition:all .15s;font-weight:500}
.pill:hover{border-color:var(--ink-300)}
.pill.selected{background:var(--carmine-600);color:var(--cream-50);border-color:var(--carmine-600)}

.bankroll-card{background:var(--cream-50);border:1px solid var(--cream-300);border-radius:12px;padding:20px 24px;margin-top:24px}
.bankroll-label{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--carmine-600);margin-bottom:10px;display:block}
.bankroll-value{font-family:var(--serif);font-style:italic;font-size:20px;color:var(--ink-900);line-height:1.4}
.bankroll-note{font-family:var(--mono);font-size:11px;color:var(--ink-500);letter-spacing:.04em;margin-top:6px;text-transform:uppercase}

/* Radio list (goal) */
.radio-list{display:flex;flex-direction:column;gap:10px}
.radio-row{background:var(--cream-50);border:1px solid var(--cream-300);border-radius:12px;padding:18px 20px;cursor:pointer;display:flex;align-items:center;gap:14px;transition:all .15s}
.radio-row:hover{border-color:var(--ink-300)}
.radio-row.selected{border-color:var(--carmine-600);background:rgba(180,55,40,.04);box-shadow:0 0 0 3px rgba(180,55,40,.08)}
.radio-circle{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink-300);flex-shrink:0;display:grid;place-items:center}
.radio-row.selected .radio-circle{border-color:var(--carmine-600)}
.radio-row.selected .radio-circle::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--carmine-600)}
.radio-text{font-family:var(--body);font-size:14px;color:var(--ink-700)}

/* Footer actions */
.actions{display:flex;justify-content:space-between;align-items:center;padding-top:24px;border-top:1px solid var(--cream-300);max-width:540px}
.btn-back{background:transparent;border:1px solid var(--cream-300);color:var(--ink-700);padding:10px 20px;border-radius:999px;font-family:var(--sans);font-size:13px;cursor:pointer;transition:all .15s;visibility:hidden}
.btn-back.show{visibility:visible}
.btn-back:hover{border-color:var(--ink-300)}
.btn-skip{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-500);background:none;border:none;cursor:pointer;padding:10px}
.btn-skip:hover{color:var(--ink-900)}
.btn-continue{background:var(--ink-900);color:var(--cream-50);border:none;padding:12px 24px;border-radius:999px;font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:8px}
.btn-continue:hover{background:var(--felt-700);transform:translateY(-1px)}
.btn-continue:disabled{opacity:.4;cursor:wait;transform:none}
.btn-continue .spinner{width:13px;height:13px;border:2px solid rgba(255,255,255,.3);border-top-color:var(--cream-50);border-radius:50%;animation:spin .7s linear infinite;display:none}
.btn-continue.loading .spinner{display:inline-block}

.error-msg{background:rgba(180,60,40,.06);border:1px solid rgba(180,60,40,.2);border-radius:8px;padding:11px 14px;font-family:var(--mono);font-size:11px;color:var(--carmine-600);margin-bottom:14px;display:none;line-height:1.5;max-width:540px}
.error-msg.show{display:block}
.success-msg{background:rgba(40,140,80,.06);border:1px solid rgba(40,140,80,.2);border-radius:8px;padding:11px 14px;font-family:var(--mono);font-size:11px;color:var(--felt-600);margin-bottom:14px;display:none;line-height:1.5;max-width:540px}
.success-msg.show{display:block}

@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  aside.left{padding:24px;gap:32px;min-height:auto}
  .welcome-title{font-size:32px;margin-bottom:18px}
  .welcome-sub{margin-bottom:24px;font-size:14px}
  .aces{display:none}
  main.right{padding:32px 24px}
  .step-eyebrow{margin-top:16px}
  .opt-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="shell">
  <aside class="left">
    <a href="/" class="brand">Edge<span class="acc">Leak</span><span class="dot"></span></a>
    <div class="left-content">
      <div class="welcome-eyebrow">· Welcome</div>
      <h1 class="welcome-title">Begin your <em>quiet</em> practice.</h1>
      <p class="welcome-sub">Quatre étapes. Cinq minutes. À la fin, EdgeLeak en saura assez sur ton jeu pour repérer tes leaks ce soir.</p>
      <div class="progress-bar" id="progress">
        <div class="pseg active"></div>
        <div class="pseg"></div>
        <div class="pseg"></div>
        <div class="pseg"></div>
      </div>
      <div class="pstep" id="pstep">STEP 01 OF 04</div>
    </div>
    <div class="aces">
      <div class="ace hearts"><span class="top">A</span><span class="mid">♥</span><span class="bot">A</span></div>
      <div class="ace spades"><span class="top">A</span><span class="mid">♠</span><span class="bot">A</span></div>
    </div>
  </aside>

  <main class="right">
    <div id="step-container"></div>
    <div class="actions">
      <button class="btn-back" id="btn-back" onclick="prev()">← Retour</button>
      <div style="flex:1"></div>
      <button class="btn-skip" id="btn-skip" onclick="next(true)">Optional · Skip →</button>
      <button class="btn-continue" id="btn-continue" onclick="next()"><span id="continue-label">Continuer →</span><span class="spinner"></span></button>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/config.js"></script>
<script>
const state = {
  step: 1,
  name: '', email: '', password: '', weekly: true,
  formats: [],
  stakes: null,
  goal: null,
};

let supa = null;
function getSupa(){
  if (supa) return supa;
  if (!window.SUPABASE_URL || !window.SUPABASE_ANON_KEY) return null;
  if (window.SUPABASE_URL.includes('YOUR_PROJECT')) return null;
  supa = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
  return supa;
}

const STAKES = ['NL10','NL25','NL50','NL100','NL200','NL500','NL1000','NL2000'];
const BANKROLL_MAP = {
  'NL10':'$500-1000', 'NL25':'$1.25k-2.5k', 'NL50':'$2.5k-5k', 'NL100':'$5k-10k',
  'NL200':'$10k-20k', 'NL500':'$25k-50k', 'NL1000':'$50k-100k', 'NL2000':'$100k-200k',
};

function renderStep(){
  const c = document.getElementById('step-container');
  document.querySelectorAll('.pseg').forEach((s,i)=>{
    s.classList.remove('active','passed');
    if (i+1 < state.step) s.classList.add('passed');
    if (i+1 === state.step) s.classList.add('active');
  });
  document.getElementById('pstep').textContent = `STEP 0${state.step} OF 04`;
  document.getElementById('btn-back').classList.toggle('show', state.step > 1);
  document.getElementById('continue-label').textContent = state.step === 4 ? 'Enter EdgeLeak →' : 'Continuer →';
  document.getElementById('btn-skip').style.display = state.step === 1 ? 'none' : 'block';

  if (state.step === 1) {
    c.innerHTML = `
      <div class="step-content">
        <div class="step-eyebrow">· Présentations</div>
        <h2 class="step-title">D'abord, les <em>présentations</em>.</h2>
        <p class="step-sub">On utilisera ton prénom pour personnaliser ton tableau de bord. Rien d'autre.</p>
        <div class="error-msg" id="err"></div>
        <div class="success-msg" id="ok"></div>
        <div class="field"><label class="field-label">Prénom</label><input class="input" id="f-name" type="text" placeholder="Léo" value="${state.name}" autocomplete="name"></div>
        <div class="field"><label class="field-label">Email</label><input class="input" id="f-email" type="email" placeholder="leo@maison.fr" value="${state.email}" autocomplete="email"></div>
        <div class="field"><label class="field-label">Mot de passe (≥ 8 caractères)</label><input class="input" id="f-pass" type="password" placeholder="••••••••" value="${state.password}" autocomplete="new-password"></div>
        <label class="checkbox-row"><input type="checkbox" id="f-weekly" ${state.weekly?'checked':''}><span>Envoie-moi un récap hebdo de mon jeu — le dimanche, en clair.</span></label>
      </div>`;
  }
  else if (state.step === 2) {
    const opts = [
      {k:'cash', t:'Cash deep stack, no clock'},
      {k:'mtt', t:'MTT — ICM, bubble, finals'},
      {k:'hu', t:'Heads-up, hyper-turbo'},
      {k:'plo', t:'PLO — 4-card omaha (bientôt)'},
    ];
    c.innerHTML = `
      <div class="step-content">
        <div class="step-eyebrow">· Ton jeu</div>
        <h2 class="step-title">Tu joues à <em>quoi</em> ?</h2>
        <p class="step-sub">Sélectionne tout ce qui s'applique. On adaptera ton tableau de bord en conséquence.</p>
        <div class="opt-grid">${opts.map(o => `<div class="opt-box ${state.formats.includes(o.k)?'selected':''}" data-k="${o.k}">${o.t}</div>`).join('')}</div>
      </div>`;
    c.querySelectorAll('.opt-box').forEach(b => b.onclick = () => {
      const k = b.dataset.k;
      const i = state.formats.indexOf(k);
      if (i >= 0) state.formats.splice(i,1); else state.formats.push(k);
      b.classList.toggle('selected');
    });
  }
  else if (state.step === 3) {
    c.innerHTML = `
      <div class="step-content">
        <div class="step-eyebrow">· Tes stakes</div>
        <h2 class="step-title">Où est-ce que tu <em>joues</em> ?</h2>
        <p class="step-sub">On calibrera les ranges et les seuils de bankroll à ton buy-in habituel.</p>
        <div class="pill-grid">${STAKES.map(s => `<div class="pill ${state.stakes===s?'selected':''}" data-s="${s}">${s}</div>`).join('')}</div>
        <div class="bankroll-card" id="bankroll-card" style="display:${state.stakes?'block':'none'}">
          <span class="bankroll-label">Bankroll suggérée</span>
          <div class="bankroll-value" id="bankroll-value">${state.stakes ? BANKROLL_MAP[state.stakes] : ''}</div>
          <div class="bankroll-note">50-100 BUY-INS · STANDARD VARIANCE</div>
        </div>
      </div>`;
    c.querySelectorAll('.pill').forEach(p => p.onclick = () => {
      c.querySelectorAll('.pill').forEach(x => x.classList.remove('selected'));
      p.classList.add('selected');
      state.stakes = p.dataset.s;
      document.getElementById('bankroll-card').style.display = 'block';
      document.getElementById('bankroll-value').textContent = BANKROLL_MAP[state.stakes];
    });
  }
  else if (state.step === 4) {
    const opts = [
      {k:'reg', t:'Reg confirmé. Volume avant tout.'},
      {k:'graduate', t:'Je veux passer de NL100 à NL500 cette année.'},
      {k:'fulltime', t:'Plein temps. Croissance bankroll au-dessus de tout.'},
      {k:'breakeven', t:'Rester break-even ou mieux. Tout tracker.'},
    ];
    c.innerHTML = `
      <div class="step-content">
        <div class="step-eyebrow">· Ton objectif</div>
        <h2 class="step-title">À quoi ressemble <em>gagner</em> pour toi ?</h2>
        <p class="step-sub">Choisis ton étoile polaire. On affichera ta progression face à elle.</p>
        <div class="error-msg" id="err"></div>
        <div class="radio-list">${opts.map(o => `
          <div class="radio-row ${state.goal===o.k?'selected':''}" data-k="${o.k}">
            <div class="radio-circle"></div>
            <div class="radio-text">${o.t}</div>
          </div>`).join('')}</div>
      </div>`;
    c.querySelectorAll('.radio-row').forEach(r => r.onclick = () => {
      c.querySelectorAll('.radio-row').forEach(x => x.classList.remove('selected'));
      r.classList.add('selected');
      state.goal = r.dataset.k;
    });
  }
}

function showError(msg){const e=document.getElementById('err');if(e){e.textContent=msg;e.classList.add('show');document.getElementById('ok')?.classList.remove('show')}}
function showOk(msg){const e=document.getElementById('ok');if(e){e.textContent=msg;e.classList.add('show')}}
function setLoading(on){const b=document.getElementById('btn-continue');b.disabled=on;b.classList.toggle('loading',on)}

function captureStep(){
  if (state.step === 1) {
    state.name = document.getElementById('f-name')?.value.trim() || '';
    state.email = document.getElementById('f-email')?.value.trim() || '';
    state.password = document.getElementById('f-pass')?.value || '';
    state.weekly = document.getElementById('f-weekly')?.checked || false;
  }
}

async function next(skip){
  captureStep();
  if (state.step === 1 && !skip) {
    if (!state.name) return showError('Indique ton prénom.');
    if (!state.email || !state.email.includes('@')) return showError('Email invalide.');
    if (!state.password || state.password.length < 8) return showError('Mot de passe ≥ 8 caractères.');
  }
  if (state.step < 4) {
    state.step++;
    renderStep();
    return;
  }
  // Final step — submit
  await submitSignup();
}

function prev(){
  if (state.step > 1) {
    captureStep();
    state.step--;
    renderStep();
  }
}

async function submitSignup(){
  if (!state.name || !state.email || !state.password) {
    showError('Manque le nom, email ou mot de passe (étape 1).');
    state.step = 1;
    renderStep();
    return;
  }
  const sb = getSupa();
  if (!sb) {
    localStorage.setItem('el_user', JSON.stringify({name:state.name, email:state.email, plan:'free'}));
    window.location.href = '/app.html';
    return;
  }
  setLoading(true);
  const { data, error } = await sb.auth.signUp({
    email: state.email,
    password: state.password,
    options: { data: { display_name: state.name } }
  });
  if (error) { setLoading(false); return showError(error.message); }

  // Insert profile with onboarding data
  if (data.user) {
    await sb.from('profiles').upsert({
      id: data.user.id,
      email: state.email,
      display_name: state.name,
      language: localStorage.getItem('el_lang') || 'fr',
      formats: state.formats,
      stakes: state.stakes,
      goal: state.goal,
      weekly_review: state.weekly,
    });
  }
  setLoading(false);
  if (data.user && !data.session) {
    showOk('Vérifie ton email pour confirmer ton compte. On te redirige vers la connexion...');
    setTimeout(() => { window.location.href = '/app.html'; }, 2500);
    return;
  }
  window.location.href = '/app.html';
}

renderStep();
</script>
